<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

   <div id="gameOverlay" class="overlay">
        <div class="overlay-content">

            <div id="overlayIcon">🎮</div>

            <h2 id="overlayTitle">Let's Play!</h2>

            <p id="overlayMessage">Tic Tac Toe</p>

            <button id="startGame">Start Game</button>

        </div>
  </div>
  <main class="game">
    <h1>Tic Tac Toe</h1>

    <div class="mode-selector">
      <button class="mode active" data-mode="friend">
        2 Players
      </button>

      <button class="mode" data-mode="computer">
        Vs Computer
      </button>
    </div>

    <div class="scoreboard">
      <div class="score">
        <span class="player-x">X</span>
        <span id="scoreX">0</span>
      </div>

      <div class="score">
        <span>Draws</span>
        <span id="scoreDraw">0</span>
      </div>

      <div class="score">
        <span class="player-o">O</span>
        <span id="scoreO">0</span>
      </div>
    </div>

    <p id="status">Player X's turn</p>

    <div class="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>

      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>

      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <button id="restart">New Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
